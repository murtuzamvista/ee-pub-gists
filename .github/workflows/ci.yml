name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan Git history
        run: gitleaks git --redact --log-opts=--all .

  test-and-audit:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup-uv.outputs.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.setup-uv.outputs.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run --locked --extra test pytest

      - name: Audit dependencies
        run: uv audit --locked

  build-image:
    name: Build Docker image
    needs: [secret-scan, test-and-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.test-and-audit.outputs.python-version }}

      - name: Build image
        run: python scripts/build_image.py -t "public-gists-api:${GITHUB_SHA}" .
