name: CI and Release Workflow

# Run validation for every change; image publication jobs below further restrict
# themselves to eligible branch and tag pushes.
on:
  push:
  pull_request:
  workflow_dispatch:

# Grant only read access to repository contents; publishing uses Docker Hub secrets.
permissions:
  contents: read

# Cancel older runs for the same branch or tag when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reuse the same registry repository for candidate and release image tags.
env:
  IMAGE_NAME: murtaza1983/ee-pub-gists
  LOCAL_IMAGE_NAME: ee-pub-gists
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # Scan all reachable Git history so secrets accidentally committed earlier
  # are detected as well as secrets in the latest revision.
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    steps:
      # Full history is required for the all-history Gitleaks scan.
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Gitleaks is installed with Go; disable caching because this repo has no go.mod.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # Pin the scanner version to keep secret-detection behavior reproducible.
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # Scan every ref's history and redact any detected secret from the logs.
      - name: Scan Git history
        run: gitleaks git --redact --log-opts=--all .

  # Establish a passing code, dependency, and security baseline before any
  # container image can be published.
  test-and-audit:
    name: Tests and dependency audit
    runs-on: ubuntu-24.04
    # Share the selected Python version with the Docker build job.
    outputs:
      python-version: ${{ steps.setup-uv.outputs.python-version }}
    steps:
      # Fetch the source and lockfiles needed for testing and auditing.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the project-pinned uv version and cache downloads keyed by the lockfile.
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Use the Python version selected by uv from .tool-versions.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.setup-uv.outputs.python-version }}

      # Install exact locked runtime and test dependencies without changing uv.lock.
      - name: Install locked dependencies
        run: uv sync --locked --extra test

      # Run the API and application test suite with the locked environment.
      - name: Run tests
        run: uv run --locked --extra test pytest

      # Check locked dependencies against known published advisories.
      - name: Audit dependencies
        run: uv audit --locked

  # Build once per eligible branch commit, scan before registry authentication,
  # and publish only the exact scanned image.
  build-image:
    name: Build, scan, and publish Docker image
    needs: [secret-scan, test-and-audit]
    # Only develop and release branches produce candidate images; PRs and other
    # branches still get the validation jobs above.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-24.04
    steps:
      # Check out the commit whose image will be built and scanned.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Match the Python version used in tests and read by the Docker build helper.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.test-and-audit.outputs.python-version }}

      # Build a local image first; do not authenticate to or publish to the registry yet.
      - name: Build image
        run: python scripts/build_image.py -t "$LOCAL_IMAGE_NAME:${GITHUB_SHA}" .

      # Fail the job on any HIGH or CRITICAL vulnerability before registry credentials
      # are made available or the image is pushed.
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          "$LOCAL_IMAGE_NAME:${GITHUB_SHA}"

      # Authenticate only after the vulnerability gate passes; use a token via stdin
      # so it is not included in the Docker command arguments.
      - name: Log in to Docker Hub
        id: docker-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      # Apply the commit tag to the scanned image and publish that same image.
      - name: Publish SHA-tagged image
        run: |
          docker tag "$LOCAL_IMAGE_NAME:${GITHUB_SHA}" "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      # Remove credentials from the runner even if publishing fails after login.
      - name: Log out of Docker Hub
        if: always() && steps.docker-login.outcome == 'success'
        run: docker logout

  # Give an approved release an easy-to-read SemVer tag by re-tagging its
  # previously built SHA image; this job deliberately does not rebuild.
  publish-release-tag:
    name: Publish SemVer tag for existing image
    needs: [secret-scan, test-and-audit]
    # Run for version-tag pushes; the first step rejects tags outside stable SemVer.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      # Accept only stable vMAJOR.MINOR.PATCH tags, excluding leading-zero components.
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example, v1.2.3)." >&2
            exit 1
          fi

      # Authenticate with the same publishing credentials used for candidate images.
      - name: Log in to Docker Hub
        id: docker-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      # Pull the candidate image for this exact commit and add the Git version tag;
      # no Docker build occurs in this release-tag workflow.
      - name: Alias the existing SHA image
        run: |
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"

      # Remove credentials from the runner after the release alias is pushed.
      - name: Log out of Docker Hub
        if: always() && steps.docker-login.outcome == 'success'
        run: docker logout

  # Update QA to the release image only after its SemVer alias is published.
  update-qa-gitops-image:
    name: Update QA image in GitOps
    needs: publish-release-tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    concurrency:
      group: gitops-qa-release-image
      cancel-in-progress: false
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: murtuzamvista/ee-pub-gists-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Set QA image tag to release
        working-directory: gitops
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          kustomization = Path("overlays/qa/kustomization.yaml")
          content = kustomization.read_text()
          lines = content.splitlines(keepends=True)
          tag_lines = [index for index, line in enumerate(lines) if line.lstrip().startswith("newTag:")]
          if len(tag_lines) != 1:
              raise SystemExit(f"Expected one QA image newTag in {kustomization}, found {len(tag_lines)}")

          index = tag_lines[0]
          indentation = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = f"{indentation}newTag: {os.environ['RELEASE_TAG']}\n"
          kustomization.write_text("".join(lines))
          PY

          git diff --check
          if git diff --quiet -- overlays/qa/kustomization.yaml; then
            echo "QA already uses $RELEASE_TAG; no GitOps commit is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/qa/kustomization.yaml
          git commit -m "Deploy $RELEASE_TAG to QA"
          git push origin main
