[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-gists-api"
version = "0.1.0"
description = "A small API that returns public GitHub Gists for a user"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx2>=2.16.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
